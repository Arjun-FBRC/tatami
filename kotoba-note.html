<!DOCTYPE html>
<script src="data.js"></script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kotoba Note — N5 & N4 Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B1A;
    --washi:#F2ECE1;
    --washi-2:#EAE2D3;
    --hanko:#B3402F;
    --ai:#35507A;
    --sumi:#6B655C;
    --bamboo:#5C7A5C;
    --line: rgba(28,27,26,0.14);
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--washi);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .jp{font-family:'Shippori Mincho', serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  /* ---------- texture ---------- */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(28,27,26,0.025) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(28,27,26,0.025) 0, transparent 40%);
  }

  /* ---------- header ---------- */
  header{
    position:relative; z-index:1;
    padding:48px 24px 32px;
    max-width:1080px; margin:0 auto;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:24px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:16px;}
  .stamp{
    width:56px; height:56px; border:2px solid var(--hanko); border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--hanko); font-family:'Shippori Mincho',serif; font-weight:700; font-size:26px;
    transform:rotate(-3deg); flex:none;
  }
  .brand h1{font-size:28px; margin:0; font-family:'Shippori Mincho',serif; font-weight:700;}
  .brand p{margin:2px 0 0; color:var(--sumi); font-size:13px; letter-spacing:.04em;}

  nav.levels{display:flex; gap:8px;}
  .level-btn{
    padding:10px 18px; border:1.5px solid var(--ink); background:transparent;
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:15px;
    cursor:pointer; border-radius:2px; color:var(--ink);
    transition:background .15s, color .15s;
  }
  .level-btn.active{background:var(--ink); color:var(--washi);}
  .level-btn:hover:not(.active){background:rgba(28,27,26,0.06);}

  /* ---------- tabs + search ---------- */
  .controls{
    max-width:1080px; margin:0 auto; padding:0 24px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    position:relative; z-index:1;
  }
  .cat-tabs{display:flex; gap:2px; border-bottom:1.5px solid var(--ink);}
  .cat-tab{
    padding:10px 16px; background:none; border:none; cursor:pointer;
    font-size:14px; letter-spacing:.03em; color:var(--sumi); position:relative; top:1.5px;
    border-bottom:2px solid transparent;
  }
  .cat-tab.active{color:var(--ink); font-weight:700; border-bottom:2px solid var(--hanko);}
  .search-row{display:flex; gap:8px; align-items:center;}
  #search{
    padding:9px 12px; border:1.5px solid var(--line); background:#fff;
    font-family:inherit; font-size:14px; width:220px; border-radius:2px;
  }
  #search:focus{outline:none; border-color:var(--ai);}
  .quiz-btn{
    padding:9px 16px; background:var(--hanko); color:#fff; border:none;
    font-size:13px; letter-spacing:.03em; cursor:pointer; border-radius:2px;
    font-weight:500;
  }
  .quiz-btn:hover{opacity:.9;}

  /* ---------- grid ---------- */
  main{max-width:1080px; margin:0 auto; padding:8px 24px 80px; position:relative; z-index:1;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:14px;
  }
  .grid.list-mode{grid-template-columns:1fr;}

  /* genkouyoushi card */
  .card{
    background:#fff; border:1.5px solid var(--line); border-radius:2px;
    padding:14px 12px 10px; cursor:pointer; position:relative;
    aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:border-color .15s, transform .1s;
    text-align:center;
  }
  .card:hover{border-color:var(--ink); transform:translateY(-2px);}
  .card::before, .card::after{
    content:""; position:absolute; background:var(--line);
  }
  .card::before{ top:50%; left:8px; right:8px; height:1px; } /* horizontal guide */
  .card::after{ left:50%; top:8px; bottom:8px; width:1px; } /* vertical guide */
  .card .glyph{font-family:'Shippori Mincho',serif; font-size:34px; font-weight:700; position:relative; z-index:1;}
  .card .sub{font-size:11px; color:var(--sumi); margin-top:6px; position:relative; z-index:1; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 4px;}
  .card .seal{
    position:absolute; top:6px; right:6px; width:14px; height:14px; border-radius:50%;
    border:1.5px solid var(--hanko); z-index:2; background:transparent;
  }
  .card.known .seal{background:var(--hanko);}

  /* vocab/grammar card variant (not square) */
  .grid[data-cat="vocab"] .card, .grid[data-cat="grammar"] .card{
    aspect-ratio:auto; padding:16px 14px; align-items:flex-start; text-align:left;
  }
  .grid[data-cat="vocab"] .card::before, .grid[data-cat="vocab"] .card::after,
  .grid[data-cat="grammar"] .card::before, .grid[data-cat="grammar"] .card::after{ content:none; }
  .grid[data-cat="vocab"] .card .glyph, .grid[data-cat="grammar"] .card .glyph{font-size:20px;}
  .grid[data-cat="grammar"] .card .glyph{font-family:'JetBrains Mono',monospace; font-size:16px; color:var(--ai);}

  .empty{color:var(--sumi); font-size:14px; padding:40px 0; text-align:center;}

  /* ---------- detail panel ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(28,27,26,0.45); z-index:10;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .overlay.open{display:flex;}
  .panel{
    background:var(--washi); max-width:520px; width:100%; max-height:86vh; overflow-y:auto;
    border-radius:3px; border:1.5px solid var(--ink); padding:32px 28px;
    position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .panel .close{
    position:absolute; top:16px; right:16px; background:none; border:none; cursor:pointer;
    font-size:20px; color:var(--sumi); line-height:1;
  }
  .panel .glyph-lg{font-family:'Shippori Mincho',serif; font-size:56px; font-weight:700;}
  .panel .readings{display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;}
  .readings .tag{font-size:12px; padding:3px 8px; border:1px solid var(--line); border-radius:12px; color:var(--sumi);}
  .panel .meaning{font-size:18px; font-weight:700; margin-top:14px;}
  .panel h2.pattern{font-family:'JetBrains Mono',monospace; font-size:22px; color:var(--ai); margin:0;}
  .section-label{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--hanko);
    margin-top:22px; margin-bottom:8px; font-weight:700; display:flex; align-items:center; gap:6px;
  }
  .section-label .dot{width:5px; height:5px; background:var(--hanko); border-radius:50%; display:inline-block;}
  .word-box{background:#fff; border:1px solid var(--line); padding:12px 14px; border-radius:2px;}
  .word-box .jpline{font-family:'Shippori Mincho',serif; font-size:18px;}
  .word-box .reading{color:var(--sumi); font-size:13px; margin-top:2px;}
  .sentence-box{background:#fff; border:1px solid var(--line); padding:14px 14px; border-radius:2px;}
  .sentence-box .jp{font-size:17px; margin-bottom:4px;}
  .sentence-box .romaji{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ai); margin-bottom:4px;}
  .sentence-box .en{font-size:13px; color:var(--sumi);}
  .note-box{font-size:13.5px; color:var(--ink); background:var(--washi-2); padding:12px 14px; border-radius:2px; border-left:2px solid var(--hanko);}
  .mark-btn{
    margin-top:22px; width:100%; padding:11px; border:1.5px solid var(--ink); background:none;
    cursor:pointer; font-weight:700; font-size:13px; letter-spacing:.03em; border-radius:2px;
  }
  .mark-btn.known{background:var(--ink); color:var(--washi);}

  /* AI regenerate row */
  .ai-row{margin-top:18px; border-top:1px dashed var(--line); padding-top:14px;}
  .ai-row summary{cursor:pointer; font-size:12px; color:var(--sumi); letter-spacing:.02em;}
  .ai-row input{width:100%; padding:8px 10px; border:1px solid var(--line); font-size:12px; margin:8px 0; border-radius:2px; font-family:'JetBrains Mono',monospace;}
  .ai-row button{padding:8px 14px; font-size:12px; border:1.5px solid var(--ai); color:var(--ai); background:none; cursor:pointer; border-radius:2px;}
  .ai-row .warn{font-size:11px; color:var(--sumi); margin-top:6px;}
  .ai-row .result{margin-top:10px; font-size:13px;}

  /* ---------- quiz ---------- */
  .quiz-panel{max-width:480px;}
  .quiz-q{font-size:15px; color:var(--sumi); margin-bottom:6px;}
  .quiz-glyph{font-family:'Shippori Mincho',serif; font-size:44px; text-align:center; margin:14px 0;}
  .quiz-opts{display:grid; gap:10px;}
  .quiz-opt{
    padding:12px 14px; border:1.5px solid var(--line); background:#fff; text-align:left;
    cursor:pointer; border-radius:2px; font-size:14px;
  }
  .quiz-opt.correct{border-color:var(--bamboo); background:#EFF4EE;}
  .quiz-opt.wrong{border-color:var(--hanko); background:#F7EBE9;}
  .quiz-progress{font-size:12px; color:var(--sumi); margin-bottom:12px;}
  .quiz-score{text-align:center; padding:20px 0;}
  .quiz-score .big{font-family:'Shippori Mincho',serif; font-size:48px;}

  footer{max-width:1080px; margin:0 auto; padding:20px 24px 60px; color:var(--sumi); font-size:12px; position:relative; z-index:1;}

  @media (max-width:640px){
    header{padding:32px 16px 20px;}
    .controls{padding:0 16px 16px;}
    main{padding:8px 16px 60px;}
    #search{width:150px;}
  }
  @media (prefers-reduced-motion: reduce){
    .card{transition:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="stamp">語</div>
    <div>
      <h1>Kotoba Note</h1>
      <p>N5 &amp; N4 KANJI · VOCAB · GRAMMAR — WITH AI-WRITTEN EXAMPLES</p>
    </div>
  </div>
  <nav class="levels">
    <button class="level-btn active" data-level="n5">N5</button>
    <button class="level-btn" data-level="n4">N4</button>
  </nav>
</header>

<div class="controls">
  <div class="cat-tabs">
    <button class="cat-tab active" data-cat="kanji">漢字 Kanji</button>
    <button class="cat-tab" data-cat="vocab">語彙 Vocab</button>
    <button class="cat-tab" data-cat="grammar">文法 Grammar</button>
  </div>
  <div class="search-row">
    <input id="search" type="text" placeholder="Search meaning or reading…">
    <button class="quiz-btn" id="quizBtn">Start Quiz</button>
  </div>
</div>

<main>
  <div id="grid" class="grid" data-cat="kanji"></div>
</main>

<footer>Starter dataset — N5/N4 kanji, vocab &amp; grammar with AI-authored explanations and example sentences. Extend the DATA object to add more.</footer>

<!-- Detail overlay -->
<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
/* ================== STATE ================== */
let state = { level:"n5", cat:"kanji", query:"", known:new Set() };

/* ================== RENDER ================== */
const grid = document.getElementById("grid");

function currentItems(){
  const list = DATA[state.level][state.cat];
  if(!state.query) return list;
  const q = state.query.toLowerCase();
  return list.filter(it=>{
    const hay = JSON.stringify(it).toLowerCase();
    return hay.includes(q);
  });
}

function cardMain(it){
  if(state.cat==="kanji") return it.char;
  if(state.cat==="vocab") return it.jp;
  return it.pattern;
}
function cardSub(it){
  if(state.cat==="kanji") return it.meaning;
  if(state.cat==="vocab") return it.reading + " · " + it.meaning;
  return it.meaning;
}
function idOf(it){
  return state.level+"-"+state.cat+"-"+(it.char||it.jp||it.pattern);
}

function render(){
  grid.dataset.cat = state.cat;
  const items = currentItems();
  grid.innerHTML = "";
  if(items.length===0){
    grid.innerHTML = '<div class="empty">No matches. Try a different search term.</div>';
    return;
  }
  items.forEach(it=>{
    const id = idOf(it);
    const el = document.createElement("div");
    el.className = "card" + (state.known.has(id) ? " known" : "");
    el.innerHTML = `<span class="seal"></span><div class="glyph">${cardMain(it)}</div><div class="sub">${cardSub(it)}</div>`;
    el.addEventListener("click", ()=>openDetail(it));
    grid.appendChild(el);
  });
}

/* ================== DETAIL PANEL ================== */
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");
let activeItem = null;

function openDetail(it){
  activeItem = it;
  const id = idOf(it);
  const isKnown = state.known.has(id);
  let html = `<button class="close" onclick="closeDetail()">&times;</button>`;

  if(state.cat==="kanji"){
    html += `
      <div class="glyph-lg">${it.char}</div>
      <div class="readings">
        <span class="tag mono">On: ${it.on}</span>
        <span class="tag mono">Kun: ${it.kun}</span>
      </div>
      <div class="meaning">${it.meaning}</div>
      <div class="section-label"><span class="dot"></span>Example word</div>
      <div class="word-box"><div class="jpline">${it.word.jp} <span class="mono" style="font-size:13px;color:var(--sumi)">(${it.word.reading})</span></div><div class="reading">${it.word.en}</div></div>
      <div class="section-label"><span class="dot"></span>AI explanation</div>
      <div class="note-box">${it.note}</div>
    `;
  } else if(state.cat==="vocab"){
    html += `
      <div class="glyph-lg" style="font-size:36px">${it.jp}</div>
      <div class="readings"><span class="tag mono">${it.reading}</span></div>
      <div class="meaning">${it.meaning}</div>
      <div class="section-label"><span class="dot"></span>Example sentence</div>
      <div class="sentence-box">
        <div class="jp">${it.sentence.jp}</div>
        <div class="romaji">${it.sentence.romaji}</div>
        <div class="en">${it.sentence.en}</div>
      </div>
      <div class="section-label"><span class="dot"></span>AI explanation</div>
      <div class="note-box">${it.note}</div>
    `;
  } else {
    html += `
      <h2 class="pattern">${it.pattern}</h2>
      <div class="meaning">${it.meaning}</div>
      <div class="section-label"><span class="dot"></span>Structure</div>
      <div class="word-box mono" style="font-size:13px">${it.structure}</div>
      <div class="section-label"><span class="dot"></span>Example sentence</div>
      <div class="sentence-box">
        <div class="jp">${it.sentence.jp}</div>
        <div class="romaji">${it.sentence.romaji}</div>
        <div class="en">${it.sentence.en}</div>
      </div>
      <div class="section-label"><span class="dot"></span>AI explanation</div>
      <div class="note-box">${it.note}</div>
    `;
  }

  html += `<button class="mark-btn ${isKnown?'known':''}" id="markBtn">${isKnown? '✓ Marked as known — click to unmark' : 'Mark as known'}</button>`;

  html += `
    <details class="ai-row">
      <summary>Regenerate this example with your own AI key (optional)</summary>
      <input id="apiKey" type="password" placeholder="sk-ant-... (used only in this browser tab)">
      <button id="regenBtn">Regenerate example sentence</button>
      <div class="warn">Your key is never stored or sent anywhere except directly to Anthropic's API from your browser. Don't use this on a publicly deployed site — anyone could read the key from network traffic. Fine for local/personal use.</div>
      <div class="result" id="aiResult"></div>
    </details>
  `;

  panel.innerHTML = html;
  overlay.classList.add("open");

  document.getElementById("markBtn").addEventListener("click", ()=>{
    if(state.known.has(id)){ state.known.delete(id); } else { state.known.add(id); }
    openDetail(it); // re-render panel
    render();
  });

  document.getElementById("regenBtn").addEventListener("click", regenerateExample);
}

function closeDetail(){
  overlay.classList.remove("open");
  activeItem = null;
}
overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeDetail(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeDetail(); });

async function regenerateExample(){
  const key = document.getElementById("apiKey").value.trim();
  const resultBox = document.getElementById("aiResult");
  if(!key){ resultBox.textContent = "Enter an API key first."; return; }
  resultBox.textContent = "Thinking…";
  const subject = state.cat==="kanji" ? activeItem.char : (state.cat==="vocab" ? activeItem.jp : activeItem.pattern);
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key": key, "anthropic-version":"2023-06-01" },
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:300,
        messages:[{role:"user", content:`Give one new, natural JLPT-level example sentence using "${subject}" in Japanese. Reply as JSON only: {"jp":"...","romaji":"...","en":"..."}`}]
      })
    });
    const data = await res.json();
    const text = data.content.map(b=>b.text||"").join("");
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    resultBox.innerHTML = `<div class="sentence-box"><div class="jp">${parsed.jp}</div><div class="romaji mono">${parsed.romaji}</div><div class="en">${parsed.en}</div></div>`;
  }catch(err){
    resultBox.textContent = "Couldn't reach the API — check your key or CORS settings for direct browser calls.";
  }
}

/* ================== QUIZ ================== */
document.getElementById("quizBtn").addEventListener("click", startQuiz);

function startQuiz(){
  const pool = DATA[state.level][state.cat];
  if(pool.length < 4){ alert("Not enough items in this set for a quiz yet."); return; }
  const questions = shuffle([...pool]).slice(0, Math.min(10, pool.length)).map(q=>{
    const wrongPool = shuffle(pool.filter(p=>p!==q)).slice(0,3);
    const options = shuffle([q, ...wrongPool]);
    return { q, options };
  });
  let idx = 0, score = 0;

  function renderQ(){
    if(idx >= questions.length){ renderScore(); return; }
    const {q, options} = questions[idx];
    const prompt = state.cat==="kanji" ? q.char : (state.cat==="vocab" ? q.jp : q.pattern);
    panel.innerHTML = `
      <button class="close" onclick="closeDetail()">&times;</button>
      <div class="quiz-progress">Question ${idx+1} / ${questions.length} · Score: ${score}</div>
      <div class="quiz-glyph">${prompt}</div>
      <div class="quiz-q">What does this mean?</div>
      <div class="quiz-opts">
        ${options.map((o,i)=>`<button class="quiz-opt" data-i="${i}">${o.meaning}</button>`).join("")}
      </div>
    `;
    panel.className = "panel quiz-panel";
    overlay.classList.add("open");
    document.querySelectorAll(".quiz-opt").forEach((btn,i)=>{
      btn.addEventListener("click", ()=>{
        document.querySelectorAll(".quiz-opt").forEach(b=>b.disabled=true);
        const chosen = options[i];
        if(chosen===q){ btn.classList.add("correct"); score++; }
        else{
          btn.classList.add("wrong");
          const correctBtn = [...document.querySelectorAll(".quiz-opt")][options.indexOf(q)];
          correctBtn.classList.add("correct");
        }
        setTimeout(()=>{ idx++; renderQ(); }, 900);
      });
    });
  }

  function renderScore(){
    panel.innerHTML = `
      <button class="close" onclick="closeDetail()">&times;</button>
      <div class="quiz-score">
        <div class="big">${score} / ${questions.length}</div>
        <p style="color:var(--sumi)">Nice work. Try another level or category any time.</p>
        <button class="mark-btn" onclick="closeDetail()">Done</button>
      </div>
    `;
  }
  panel.className = "panel quiz-panel";
  renderQ();
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ================== EVENTS ================== */
document.querySelectorAll(".level-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".level-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.level = btn.dataset.level;
    render();
  });
});
document.querySelectorAll(".cat-tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".cat-tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.cat = btn.dataset.cat;
    panel.className = "panel";
    render();
  });
});
document.getElementById("search").addEventListener("input", (e)=>{
  state.query = e.target.value;
  render();
});

render();
</script>
</body>
</html>
